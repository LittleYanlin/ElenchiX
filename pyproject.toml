[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elenchix"
version = "0.1.0"
description = "Minimal, graph-configurable ElenchiX research framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Yanlin Zhou"}]
dependencies = [
  "langgraph>=0.2.76,<0.4",
  "langchain-openai>=0.2,<0.4",
  "numpy==2.4.6",
  "openai>=1.50,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6.0,<7",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
kt = [
  "pykt-toolkit @ git+https://github.com/pykt-team/pykt-toolkit.git@3aabdc3cab06a57e745518b070d31bcbb823af2c",
  "torch==2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/elenchix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
